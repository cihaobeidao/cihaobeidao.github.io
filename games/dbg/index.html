<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="data:,"><title>DBG合作吃墩</title><style>/* 合作打怪 · 界面样式
   规则：色相只属于花色。红黄蓝绿黑五色留给牌，其余界面一律纸与墨。
   强调靠反白、实心墨块和印章，不引入第六种颜色。 */

/* ── 变量 ───────────────────────────────────────────── */
:root{
  --paper:#E3E1D6;        /* 页面纸底 */
  --paper-2:#ECEAE0;      /* 面板 */
  --card:#F8F6EE;         /* 牌面纸 */
  --ink:#15181B;          /* 墨 */
  --ink-2:#474D51;        /* 次级文字 */
  --ink-3:#5C6165;        /* 弱化文字，对比度 ≥4.5 */
  --rule:#B4AF9E;         /* 细线 */
  --rule-2:#D6D2C5;       /* 更淡的细线／压印投影 */
  --block:#16191C;        /* 桌面墨版 */
  --on-block:#E8E6DC;     /* 墨版上的字 */
  --on-block-2:#E8E6DC9e; /* 墨版上的次级字 */
  --on-block-3:#E8E6DC91; /* 墨版上的弱化字，对比度 5.5 */
  --on-block-line:#E8E6DC5c; /* 墨版上的细线与套准线，纯装饰不承载文字 */

  --font-body:"PingFang SC","Microsoft YaHei",-apple-system,system-ui,sans-serif;
  --font-display:"Songti SC","STSong","Noto Serif CJK SC",serif;
  --font-num:Didot,"Bodoni 72","Songti SC",Georgia,serif;

  --r-lg:6px; --r:3px; --r-sm:2px;
  --ease:cubic-bezier(.2,0,0,1);

  font-family:var(--font-body);
  font-size:15px;
  color:var(--ink);
  background:var(--paper);
}

/* ── 基础 ───────────────────────────────────────────── */
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;
  background:var(--paper);
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}
header,main{max-width:1280px;margin-inline:auto}
main{padding:0 26px 40px}
p{line-height:1.7;margin:8px 0;text-wrap:pretty}
h1,h2,h3{text-wrap:balance}
a{color:var(--ink)}
small,.muted{color:var(--ink-3)}
small{font-size:11px;line-height:1.55}
[hidden]{display:none!important}

h1{font-family:var(--font-display);font-size:21px;font-weight:600;letter-spacing:.16em;margin:0}
h2{font-family:var(--font-display);font-size:20px;font-weight:600;letter-spacing:.04em;margin:0 0 14px}
h3{font-size:14px;font-weight:600;letter-spacing:.02em;margin:0 0 8px}
.eyebrow{font-size:10px;letter-spacing:.24em;color:var(--ink-3);margin:0 0 6px}

/* ── 报头 ───────────────────────────────────────────── */
header{
  display:flex;justify-content:space-between;align-items:center;
  padding:20px 26px 13px;
  border-bottom:2px solid var(--ink);
  margin-bottom:14px;
}
.brand-mark{display:inline!important;font-size:15px!important;color:var(--ink)!important;margin:0 7px 0 0!important;vertical-align:.08em}
#reset{min-height:32px;padding:6px 12px;font-size:11px;letter-spacing:.08em;border-color:var(--rule);color:var(--ink-3)}
#reset:hover:not(:disabled){background:var(--ink);border-color:var(--ink);color:var(--card)}

/* ── 控件 ───────────────────────────────────────────── */
button,select,input{font:inherit}
button{
  border:1px solid var(--ink);border-radius:var(--r-sm);
  background:transparent;color:var(--ink);
  padding:9px 15px;min-height:38px;
  letter-spacing:.04em;cursor:pointer;
  transition-property:background-color,color,border-color,transform,box-shadow,opacity;
  transition-duration:.14s;transition-timing-function:var(--ease);
}
/* 牌和座位有各自的悬停样式，排除在外，避免被通用规则盖掉 */
button:not(.card):not(.seat-name):hover:not(:disabled){background:var(--ink);color:var(--card)}
button:not(.card):active:not(:disabled){transform:scale(.96)}
button.primary{background:var(--ink);color:var(--card)}
button.primary:hover:not(:disabled){background:var(--ink-2);border-color:var(--ink-2)}
button:disabled{opacity:.34;cursor:not-allowed}
button:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

select{
  appearance:none;padding:9px 32px 9px 13px;max-width:100%;
  border:1px solid var(--ink);border-radius:var(--r-sm);
  color:var(--ink);cursor:pointer;
  background-color:var(--card);
  background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);
  background-position:right 16px top 53%,right 11px top 53%;
  background-size:5px 5px,5px 5px;
  background-repeat:no-repeat;
}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--ink)}

label{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:10px 0;font-size:12px;color:var(--ink-2)}
label.pick-label{flex-direction:column;align-items:stretch;gap:6px}
.pick-label{font-size:10px;letter-spacing:.14em;color:var(--ink-3)}

details{margin:10px 0}
summary{cursor:pointer;font-size:12px;color:var(--ink-2);letter-spacing:.04em}
summary::marker{color:var(--ink-3)}

/* ── 版面骨架 ───────────────────────────────────────── */
.panel{background:var(--paper-2);border:1px solid var(--rule);border-radius:var(--r);padding:20px;margin-bottom:14px}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.spread{justify-content:space-between}
.scroll{max-height:400px;overflow:auto}

/* 顶部数据条：横线夹出的一行，数字等宽防抖 */
.stats{
  display:flex;gap:26px;flex-wrap:wrap;align-items:baseline;
  margin:0 0 12px;padding:9px 0;
  border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);
  font-size:11px;letter-spacing:.1em;color:var(--ink-3);
}
.stats b{font-family:var(--font-num);font-size:18px;color:var(--ink);margin:0 3px;font-variant-numeric:tabular-nums}

/* ── 关卡节点 ───────────────────────────────────────── */
.nodes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.node{
  background:var(--paper-2);border:1px solid var(--rule);
  border-left:3px solid var(--rule);border-radius:var(--r-sm);padding:12px 14px;
}
.node.current{border-left-color:var(--ink);background:var(--card)}
.node small{display:block;font-size:10px;letter-spacing:.1em;color:var(--ink-3)}
.node h3{font-family:var(--font-display);font-size:16px;margin:5px 0 6px}
.future-nodes{margin:0 0 12px}
.future-nodes>.nodes{margin-top:10px}

/* ── 怪物票 ─────────────────────────────────────────── */
/* 票面到内容为止，不跟着桌面拉高，免得框住一大块空白 */
.monster-panel{grid-column:2;grid-row:1;margin:0;align-self:start;padding:18px}
.monster-panel h2{font-size:29px;letter-spacing:.05em;margin:0}
.monster-panel>.row.spread>span{font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.monster-panel p.eyebrow{display:block;border:0;padding:0;text-indent:0}
/* 标签／数值两栏的规格表。
   用 inline-block 加悬挂缩进而不是 flex：flex 子项是块级盒，
   innerText 会在标签和数值之间插入换行，测试取不到"标记点数 7"这类整行文本。 */
.monster-panel p{
  margin:0;padding:8px 0 8px 56px;text-indent:-56px;
  border-top:1px solid var(--rule-2);
  font-size:12px;line-height:1.6;
}
.monster-panel p>b{
  display:inline-block;width:46px;margin-right:10px;text-indent:0;vertical-align:1px;
  font-size:10px;font-weight:600;letter-spacing:.12em;color:var(--ink-3);
}
/* 没有标签的补充说明整段对齐到数值栏 */
.monster-panel p:not(:has(b)){text-indent:0}
.health{
  height:9px;margin:11px 0 14px;
  background:var(--paper);border:1px solid var(--rule);
  overflow:hidden;
}
.health i{display:block;height:100%;background:var(--ink);transition:width .35s var(--ease)}
.deck-count{
  display:flex;gap:18px;margin-top:14px;padding-top:12px;
  border-top:1px solid var(--rule);font-size:11px;color:var(--ink-3);
}
.deck-count b{font-family:var(--font-num);font-size:16px;color:var(--ink);margin-left:5px;font-variant-numeric:tabular-nums}

/* ── 战场：墨版桌面 + 怪物票 ────────────────────────── */
.battlefield{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:16px;align-items:stretch;margin:0 0 14px}
.table-wrap{grid-column:1;grid-row:1;margin:0;min-width:0;display:flex}
.table-top{
  position:relative;
  display:grid;width:100%;
  grid-template-columns:minmax(0,1fr) minmax(140px,.92fr) minmax(0,1fr);
  grid-template-areas:". north ." "west center east" ". south .";
  gap:12px 20px;padding:22px;
  background:var(--block);color:var(--on-block);
  border-radius:var(--r-lg);
}
/* 四角套准线：印版的定位记号 */
.table-top::after{
  content:"";position:absolute;inset:9px;pointer-events:none;
  --t:var(--on-block-line);
  background:
    linear-gradient(var(--t),var(--t)) left 0 top 0/13px 1px no-repeat,
    linear-gradient(var(--t),var(--t)) left 0 top 0/1px 13px no-repeat,
    linear-gradient(var(--t),var(--t)) right 0 top 0/13px 1px no-repeat,
    linear-gradient(var(--t),var(--t)) right 0 top 0/1px 13px no-repeat,
    linear-gradient(var(--t),var(--t)) left 0 bottom 0/13px 1px no-repeat,
    linear-gradient(var(--t),var(--t)) left 0 bottom 0/1px 13px no-repeat,
    linear-gradient(var(--t),var(--t)) right 0 bottom 0/13px 1px no-repeat,
    linear-gradient(var(--t),var(--t)) right 0 bottom 0/1px 13px no-repeat;
}

.table-center{
  grid-area:center;align-self:center;
  display:grid;gap:5px;align-content:center;justify-items:center;
  min-height:124px;padding:16px 10px;
  border:1px dashed var(--on-block-line);border-radius:var(--r);
  text-align:center;
  transition-property:background-color,border-color,box-shadow;
  transition-duration:.14s;transition-timing-function:var(--ease);
}
.table-center b{font-family:var(--font-display);font-size:19px;font-weight:500;letter-spacing:.08em}
.table-center small{font-size:11px;color:var(--on-block-2)}
.table-mark{font-size:20px;line-height:1;color:var(--on-block-line)}
.drop-caption{font-size:10px;letter-spacing:.16em;color:var(--on-block-3)}
/* 结算结果：命中盖实心，未中留空心 */
.table-center .hit,.table-center .miss{
  font-family:var(--font-display);font-size:12px;letter-spacing:.1em;
  padding:5px 9px;margin-top:2px;
}
.table-center .hit{background:var(--on-block);color:var(--block);font-weight:600}
.table-center .miss{border:1px solid var(--on-block-3);color:var(--on-block-2)}
.table-center .hit small,.table-center .miss small{color:inherit;font-size:10px;letter-spacing:0}

.seat-0{grid-area:south}
.seat-1{grid-area:west}
.seat-2{grid-area:north}
.seat-3{grid-area:east}
.table-seat{display:flex;flex-direction:column;gap:6px;min-width:0;max-width:216px;width:100%;justify-self:center}
/* 南座在下方，牌靠近桌心 */
.seat-0 .played{order:1}
.seat-0 .seat-name{order:2}
.seat-0 .seat-gear{order:3}

.seat-name{
  display:flex;align-items:center;gap:7px;
  padding:6px 10px;min-height:34px;
  background:transparent;color:var(--on-block);
  border:1px solid var(--on-block-line);border-radius:var(--r-sm);
}
.seat-name:disabled{opacity:1;cursor:default}
.seat-name .avatar{
  width:20px;height:20px;flex:none;display:grid;place-items:center;
  border:1px solid var(--on-block-line);border-radius:50%;
  font-family:var(--font-num);font-size:12px;line-height:1;
}
.seat-name b{font-size:12px;font-weight:600}
.seat-name small{margin-left:auto;font-size:10px;color:var(--on-block-2);font-variant-numeric:tabular-nums}
/* 当前行动的座位整块反白 */
.acting .seat-name{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.acting .seat-name small{color:var(--ink-3)}
.acting .seat-name .avatar{border-color:var(--ink-3)}
.seat-name.targetable{border-color:var(--on-block);cursor:pointer}
.seat-name.targetable:hover{background:var(--on-block-3)}
.table-seat.winner .seat-name{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.table-seat.winner .seat-name small{color:var(--ink-3)}

.table-seat .played{
  padding:8px 10px;min-height:76px;gap:3px;
  border-radius:var(--r-sm);
  box-shadow:0 1px 2px #0003,0 3px 8px #00000026;
}
.table-seat .played>small{font-size:10px;color:var(--ink-3)}
.table-seat .played strong{font-size:23px}
.table-seat .played .desc{font-size:10px;line-height:1.5}
.table-seat .played:has(.waiting){background:transparent;border:1px dashed var(--on-block-line);box-shadow:none}
.table-seat .waiting{font-size:11px;color:var(--on-block-3);text-align:center;margin:auto}
/* 获胜的牌在墨版上镶一圈纸白 */
.table-seat .played.winner{box-shadow:0 0 0 2px var(--paper),0 3px 8px #00000026}

.seat-gear{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;font-size:10px}
.seat-gear details{margin:0}
.seat-gear summary{font-size:10px;color:var(--on-block-2)}
.seat-gear small{color:var(--on-block-2)}
.seat-gear p{
  position:relative;z-index:3;max-width:206px;margin:5px 0 0;
  padding:8px 9px;background:var(--card);color:var(--ink);
  border-radius:var(--r-sm);font-size:11px;line-height:1.6;
  box-shadow:0 2px 6px #00000038;
}

/* ── 牌 ─────────────────────────────────────────────── */
.red{--suit:#A8342B}
.yellow{--suit:#7C5D0F}
.blue{--suit:#27558C}
.green{--suit:#1D6A4A}
.black{--suit:#1B1E22}

.card{
  position:relative;isolation:isolate;overflow:hidden;
  display:flex;flex-direction:column;gap:6px;
  padding:13px 13px 24px;
  background:var(--card);color:var(--ink);
  border:1px solid var(--rule);border-radius:var(--r);
  text-align:left;min-height:220px;
  box-shadow:2px 2px 0 var(--rule-2);
  transition-property:transform,box-shadow,border-color,background-color,filter,opacity;
  transition-duration:.16s;transition-timing-function:var(--ease);
}
.hand .card,.pick-group .card{flex:0 0 152px;min-width:152px}
.card .number{
  font-family:var(--font-num);font-size:30px;line-height:1.05;
  color:var(--suit);font-variant-numeric:tabular-nums;
}
/* 花色作水印填满中段，没有能力文字的牌也不空 */
.suit-emblem{
  position:absolute;z-index:-1;right:-10px;top:50%;transform:translateY(-50%);
  font-family:Georgia,serif;font-size:104px;line-height:1;
  color:var(--suit);opacity:.1;pointer-events:none;
}
.card .desc{
  margin-top:auto;padding-top:8px;
  border-top:1px solid var(--rule-2);
  font-size:11.5px;line-height:1.6;color:var(--ink-2);
}
.card .desc:empty{display:none}
.card-corner{
  position:absolute;bottom:7px;right:11px;transform:rotate(180deg);
  font-family:var(--font-num);font-size:13px;color:var(--suit);opacity:.7;
}
.card-flag{
  position:absolute;z-index:2;top:8px;right:8px;
  padding:3px 6px;border-radius:var(--r-sm);
  background:var(--ink);color:var(--card);
  font-size:10px;line-height:1;letter-spacing:.06em;
}
button.card:hover:not(:disabled){
  background:#FFFDF5;color:var(--ink);
  transform:translateY(-6px);border-color:var(--suit);
  box-shadow:2px 8px 0 var(--rule-2),0 10px 18px #15181b24;
}
button.card:active:not(:disabled){transform:translateY(-3px)}
/* 选中态要压过悬停态，所以特指度提高一级 */
button.card.selected,button.card.picked,button.card[aria-pressed="true"]{
  background:#FFFDF5;
  border-color:var(--ink);
  transform:translateY(-8px);
  box-shadow:0 0 0 2px var(--ink),2px 10px 0 #15181b1f;
}
/* 当前跟不了的牌：褪色下沉，原因写在角标上 */
.hand .card.needs-adjustment:not(.selected){filter:grayscale(.82);opacity:.52;transform:translateY(7px)}
.hand .card.needs-adjustment:not(.selected):hover:not(:disabled){filter:grayscale(.3);opacity:.92;transform:translateY(0)}
.card:disabled,.hand .card:disabled{opacity:1;cursor:default}

.hand{
  display:flex;gap:11px;align-items:stretch;
  justify-content:safe center;
  margin:0;padding:14px 4px 16px;
  overflow-x:auto;min-width:0;
  scrollbar-color:var(--rule) transparent;
}
.hand-panel{padding:16px 20px}
.hand-panel>.row>h2{font-size:17px;margin:0}
.hand-panel h2 small{margin-left:9px;font-size:11px;font-weight:400;color:var(--ink-3);letter-spacing:.06em}
button[data-hand-scroll]{width:40px;min-width:40px;height:40px;padding:0;font-size:17px;line-height:1}
.hand-panel:has(.choices) [data-hand-scroll]{display:none}

/* ── 出牌控制与结算问询 ─────────────────────────────── */
.controls{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:15px 16px;margin-top:12px}
.controls>b{font-size:13px;letter-spacing:.02em}
.idle-controls{display:flex;align-items:center;gap:16px}
.idle-controls p{margin:0;font-size:12px}
#playHint{font-size:12px;color:var(--ink-2);margin:10px 0}
.choices{padding:4px 0 0}
.choice-note{
  margin:10px 0;padding:3px 0 3px 11px;
  border-left:2px solid var(--ink);background:transparent;
  font-size:12px;line-height:1.65;color:var(--ink-2);
}
.item-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px;padding-top:8px}
.item-actions button{font-size:12px;min-height:34px;padding:7px 12px}

/* 点选组：选中即反白，唯一的例外是花色按钮本身代表花色 */
.pick-group{display:flex;flex-wrap:wrap;gap:8px;margin:0;max-width:100%}
.pick-group button:not(.card){font-size:12px;min-height:34px;padding:7px 12px}
.pick-group .card{min-height:214px;margin:4px 0}
.pick-group[data-field="choice-card"]{max-height:290px;overflow:auto;padding:8px 5px}
.pick-group[data-field="delete-card"]{max-height:360px;overflow:auto}
.picked:not(.card),[aria-pressed="true"]:not(.card){
  background:var(--ink)!important;color:var(--card)!important;border-color:var(--ink)!important;
}
.suit-pick{border-color:var(--suit);color:var(--suit)}
.suit-pick:hover:not(:disabled){background:var(--suit);color:var(--card)}
.suit-pick.picked,.suit-pick[aria-pressed="true"]{background:var(--suit)!important;border-color:var(--suit)!important;color:var(--card)!important}

/* ── 出牌记录 ───────────────────────────────────────── */
.trick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0 0}
.played{
  display:flex;flex-direction:column;gap:5px;min-width:0;min-height:112px;
  padding:11px;text-align:left;
  background:var(--card);color:var(--ink);
  border:1px solid var(--rule);border-top:2px solid var(--suit,var(--rule));
  border-radius:var(--r-sm);
}
.played>small{font-size:10px;color:var(--ink-3);letter-spacing:.06em}
.played strong{
  margin:0;font-family:var(--font-num);font-size:25px;line-height:1.05;
  color:var(--suit,var(--ink));font-variant-numeric:tabular-nums;
}
.played .desc{margin:0;font-size:11px;line-height:1.55;color:var(--ink-2)}
.played .original{font-size:10px;color:var(--ink-3)}
.played:has(>.muted){min-height:72px}
.played:has(.desc:empty) .desc{display:none}
.card-back{
  flex:1;display:grid;place-items:center;align-content:center;gap:4px;padding:12px;
  background:repeating-linear-gradient(45deg,var(--ink) 0 5px,#252B2F 5px 10px);
  color:var(--paper);border-radius:var(--r-sm);text-align:center;
}
.card-back strong{color:var(--paper)!important;font-family:var(--font-display);font-size:13px;letter-spacing:.2em}
.card-back small{color:#E8E6DC8f}

/* 获胜印章 */
.winner-label{
  align-self:flex-start;margin-top:auto;
  padding:5px 8px;
  background:var(--ink);color:var(--card);
  font-family:var(--font-display);font-size:11px;font-weight:600;
  letter-spacing:.24em;text-indent:.24em;line-height:1;
  box-shadow:0 0 0 2px var(--card),0 0 0 3px var(--ink);
  transform:rotate(-3.5deg);
}
.table-seat .winner-label{margin-top:6px}

.result{
  margin:0;padding:10px 12px;border-radius:var(--r-sm);
  background:var(--ink);color:var(--paper);
  font-size:12px;line-height:1.75;
}
.result small{color:#E8E6DCb3}
.trick-record+.trick-record{margin-top:16px;padding-top:16px;border-top:1px solid var(--rule)}
.played-history{margin-top:16px}
.played-history>h3{font-size:11px;letter-spacing:.16em;color:var(--ink-3)}
.earlier-tricks{margin-top:14px}

/* 一个回合打完的判定面板 */
.review-panel{border:1px solid var(--ink);border-left:4px solid var(--ink);background:var(--card)}
.review-panel h3{font-family:var(--font-display);font-size:19px;margin:0 0 5px}
.review-panel p{margin:0;font-size:12.5px;color:var(--ink-2)}
.review-panel p small{color:var(--ink-3)}
.review-panel .row{gap:18px}

/* ── 采购 ───────────────────────────────────────────── */
.deck-summary{
  display:flex;flex-wrap:wrap;gap:7px 22px;align-items:baseline;
  margin:4px 0 16px;padding:11px 0;
  border-top:1px solid var(--rule-2);border-bottom:1px solid var(--rule-2);
  font-size:12px;
}
.deck-summary>.pick-label{width:100%;margin-bottom:2px}
.deck-suit b{font-family:var(--font-display);font-weight:600;color:var(--suit)}
.deck-suit small{margin-left:5px;font-family:var(--font-num);font-size:12px;letter-spacing:.1em;color:var(--ink-3)}
.deck-suit u{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px;color:var(--ink)}
.deck-summary>.muted{width:100%;margin-top:2px;font-size:11px}

.market{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;padding:2px 0 18px}
/* 高度交给网格行拉齐，不写死 min-height，短文案的卡就不会撑出空洞 */
.product{
  display:flex;flex-direction:column;gap:9px;min-width:0;
  padding:15px;background:var(--paper-2);
  border:1px solid var(--rule);border-radius:var(--r);
}
.product.card{background:var(--card);padding:15px 15px 15px;gap:9px}
.product.card .number{font-size:31px}
.product.card .suit-emblem{font-size:92px;right:-6px}
.product.card .desc{margin:0;font-size:12.5px}
.product.card .card-corner{display:none}
.product h3{font-family:var(--font-display);font-size:17px;margin:2px 0 0}
.product .desc{flex:1;font-size:12.5px;line-height:1.7;color:var(--ink-2)}
.product .badge{
  align-self:flex-start;padding:3px 7px;border-radius:0;
  background:var(--ink);color:var(--card);
  font-size:10px;letter-spacing:.16em;
}
.product.empty{
  align-items:center;justify-content:center;text-align:center;
  background:transparent;border-style:dashed;color:var(--ink-3);box-shadow:none;
}
/* 四个玩家按钮排成一行，不折行 */
.product .pick-group{display:grid;grid-template-columns:repeat(auto-fit,minmax(44px,1fr));gap:5px}
.product .pick-group button{padding:5px 6px;font-size:11px;min-height:30px}
.product button[data-action="buy"]{margin-top:auto}
.price{font-family:var(--font-num);font-size:19px;color:var(--ink)}

.players{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:16px}
.player{padding:11px 13px;background:var(--paper-2);border:1px solid var(--rule);border-radius:var(--r-sm)}
.player h3{margin-bottom:0;font-size:13px}
.player details{margin-bottom:0}
.player p{font-size:12px}
.token{font-size:11px;color:var(--ink-3)}
.badge{display:inline-block;padding:3px 7px;border-radius:var(--r-sm);background:var(--rule-2);font-size:11px}

/* ── 开局 ───────────────────────────────────────────── */
.setup{
  max-width:620px;margin:52px auto;padding:48px 44px 38px;
  text-align:center;background:var(--paper-2);
  border:1px solid var(--rule);border-radius:var(--r);
  box-shadow:3px 3px 0 var(--rule-2);
}
.setup .opening-emblem{
  margin:0 0 28px;font-family:Georgia,serif;font-size:34px;
  letter-spacing:18px;text-indent:18px;color:var(--ink);line-height:1;
}
.opening-emblem span{color:var(--suit,var(--ink))}
.setup .eyebrow{margin:0 0 16px}
.setup h2{font-size:40px;line-height:1.35;margin:0 0 16px}
.setup p{margin-bottom:16px}
.setup label{justify-content:center;margin:26px 0}
.setup button{min-width:172px}
.how-to{margin:26px 0 0;padding-top:16px;border-top:1px solid var(--rule);text-align:left}
.how-to summary{text-align:center;font-size:12px;letter-spacing:.08em;color:var(--ink-3)}
.how-to p{margin:10px 0;font-size:12.5px;line-height:1.85;color:var(--ink-2)}

/* 传屏／等待：整屏转墨，手牌自然藏起来 */
.secret{
  margin-top:14px;padding:30px;text-align:center;
  background:var(--block);color:var(--on-block);
  border:1px solid var(--block);border-radius:var(--r);
}
/* 只有交屏提示配得上整块墨；等电脑出牌只是一行状态 */
.secret:not(:has(h3)){padding:15px;font-size:13px}
.secret h3{font-family:var(--font-display);font-size:20px;color:var(--on-block);margin-bottom:16px}
.secret button{border-color:var(--on-block-3);color:var(--on-block)}
.secret button:hover:not(:disabled){background:var(--on-block);color:var(--block)}
.secret button.primary{background:var(--on-block);color:var(--block);border-color:var(--on-block)}
.secret button.primary:hover:not(:disabled){background:var(--paper);border-color:var(--paper)}
.screen-end{padding:48px;text-align:center}
.screen-end h2{font-size:30px}

/* ── 拖拽与提示 ─────────────────────────────────────── */
.hand [data-drag-card],[data-drag-choice]{touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.hand [data-drag-card]:active,[data-drag-choice]:active{cursor:grabbing}
.drop-ready{outline:1px dashed var(--on-block);outline-offset:2px}
.drop-over{background:#E8E6DC1f!important;border-color:var(--on-block)!important;box-shadow:inset 0 0 0 1px var(--on-block)!important}
.dragging{opacity:.25!important}
.drag-ghost{
  position:fixed!important;z-index:1000;pointer-events:none;
  width:148px;min-height:212px;max-height:250px;
  transform:rotate(-4deg)!important;
  box-shadow:0 16px 30px #15181b59!important;opacity:.96;
}
#interaction-status{
  position:fixed;z-index:40;bottom:18px;left:50%;transform:translateX(-50%);
  max-width:90vw;padding:11px 18px;border-radius:var(--r-sm);
  background:var(--ink);color:var(--paper);font-size:12px;
  box-shadow:0 4px 16px #15181b40;pointer-events:none;
}
#interaction-status:empty{display:none}
#error{
  position:sticky;z-index:50;top:0;
  max-width:1280px;margin-inline:auto;
  padding:11px 26px;border-left:4px solid var(--ink);
  background:var(--ink);color:#F0CEC9;font-size:13px;
}

/* ── 动效：只给落章这一刻 ───────────────────────────── */
@keyframes stamp{
  from{transform:rotate(-3.5deg) scale(1.55);opacity:0}
  55%{opacity:1}
  to{transform:rotate(-3.5deg) scale(1);opacity:1}
}
@keyframes rise{
  from{transform:translateY(8px);opacity:0}
  to{transform:translateY(0);opacity:1}
}
.table-seat .winner-label{animation:stamp .17s var(--ease) 60ms both}
.table-center .hit,.table-center .miss{animation:rise .2s var(--ease) 120ms both}
.review-panel{animation:rise .24s var(--ease) 200ms both}

/* ── 窄屏 ───────────────────────────────────────────── */
@media(max-width:1080px){

// 取文案并填占位符。缺键、占位符没给值、给的值是 null/undefined，一律抛错，
// 宁可当场炸也不要让 {p1} 或 "undefined" 漏到界面上——那种错在试玩时会被当成美术问题。
// 用 Object.hasOwn 而不是 in，避免 toString、__proto__ 这类原型上的名字被当成文案键。
function t(key, params){
  if (!Object.hasOwn(strings, key)) throw new Error(`缺少文案：${key}`);
  return strings[key].replace(/\{(\w+)\}/g, (slot, name) => {
    if (!params || !Object.hasOwn(params, name)) throw new Error(`文案 ${key} 没有给 ${slot} 取值`);
    const v = params[name];
    if (v === null || v === undefined) throw new Error(`文案 ${key} 的 ${slot} 取到了 ${v}`);
    return v;
  });
}

return {strings:strings,t:t};

 const gate=monsterGate(monster,memory),winner=Math.max(0,trickWinner(played,leadSuit,gate.lowest,excluded)),card=played[winner];
 const forced=card.ability==="forced_hit"&&!suppressed.includes(card.player);
 const hit=forced||acceptsSuit(gate,memory.step,card.suit)&&(!gate.size||(gate.size==="small"?small(card.rank):large(card.rank)))
  &&(!gate.echo||card.rank===memory.echoRank)&&(!gate.rotate||memory.last===null||card.player!==memory.last)
  &&(!gate.unique||!memory.marks.includes(card.player))&&(gate.position===undefined||winner===gate.position);
 const ranks=played.map(x=>x.rank),numSuits=new Set(played.map(x=>x.suit)).size;
 const asc=ranks.slice(1).every((n,i)=>n>ranks[i]),desc=ranks.slice(1).every((n,i)=>n<ranks[i]);

  breach:monster.breach&&memory.step%2===1,large:large(card.rank),small:small(card.rank),two_plus_suits:numSuits>=2,two_suits:numSuits===2,three_suits:numSuits===3,
  new_attacker:memory.last!==null&&card.player!==memory.last,minimum_small:small(Math.min(...ranks)),ordered:asc||desc,ascending:asc,fourth_non_green:played[3].suit!=="green",even:card.rank%2===0,both_sizes:ranks.some(small)&&ranks.some(large)};
 const extra=!forced&&hit&&extraConditions[monster.extraRule]?monster.extra:0;

}

const choiceCards = s => {
 const q=s.pending,p=s.players[q.player];
 if(q.drawn)return q.drawn;
 if(q.id==="recover_one")return s.discard;
 if(q.id==="recover_spent")return s.spent;
 if(q.id==="recover_low")return s.spent.filter(c=>c.rank<=6);
 if(q.id==="pass_high")return p.hand.filter(c=>c.rank>=7);
 if(q.id==="axe_offer")return s.played.filter(c=>!s.returned.includes(c.uid));
 if(q.id==="flask_offer")return s.flask?[s.flask]:s.played.filter(c=>c.player===q.player&&!c.phantom&&!c.exhaust&&!s.returned.includes(c.uid));
 if(q.id==="shell_offer")return q.options||[];
 return p.hand;
};

class Game {

    s.supply=this.shuffle(supply.flatMap(x=>Array.from({length:x.quantity},(_,i)=>({...x,uid:`${x.id}_${i+1}`}))));

  }

  buy(index,owner=0,replace=null){
    const s=this.s;check(s.phase==="shop",t("engine.buy.err1"));const x=s.market[index],p=s.players[owner];check(x&&p,t("engine.buy.err2"));check(s.gold>=x.price,t("common.no_gold"));

    s.gold-=x.price;s.market[index]=null;this.log(x.type==="牌库牌"?t("engine.buy.log_deck",{p1:x.name}):t("engine.buy.log_owner",{p1:x.name,p2:owner+1}));
  }
  refresh(){const s=this.s;check(s.phase==="shop"&&s.gold>=C.market_refresh_cost,t("engine.refresh.err1"));s.gold-=C.market_refresh_cost;s.supplyDiscard.push(...s.market.filter(Boolean));s.market=[];this.fillMarket();}
  deleteCard(uid){const s=this.s;check(s.phase==="shop"&&!s.deleted,t("engine.deleteCard.err1"));check(s.gold>=C.deck_delete_cost,t("common.no_gold"));const i=s.deck.findIndex(c=>c.uid===uid);check(i>=0,t("engine.deleteCard.err3"));s.deck.splice(i,1);s.gold-=C.deck_delete_cost;s.deleted=true;this.log(t("engine.deleteCard.log1"));}

    s.excluded=[];s.noFollow=[];s.delayed=null;s.declaredLead=null;s.dice=[];s.cloakPair=null;

      if(q.items.some(x=>x.id==="ITEM_SEAT"))s.jobs.push({player:i,person:s.seats[i],id:"seat_offer"});
      if(q.items.some(x=>x.id==="ITEM_PLEDGE"))s.jobs.push({player:i,person:s.seats[i],id:"pledge_offer"});
      if(has(q,"GEAR_SIGN")&&!q.uses.sign)s.jobs.push({player:i,person:s.seats[i],id:"sign_offer"});
    }

    this.log(t("engine.startBattle.log1",{p1:s.level,p2:s.monster.name,p3:s.hp,p4:retry?t("engine.startBattle.retry_mark"):""}));

  retry(){check(this.s.phase==="retry",t("engine.retry.err1"));this.startBattle(true);}

  observe(cards,owner,viewers=[0,1,2,3]){for(const i of viewers){const p=this.s.players[i];p.botKnown||={};for(const c of cards)p.botKnown[c.uid]=owner;}}

    for(let i=0;i<4;i++){const p=this.s.players[i],top=p.botTop||[];

    }
    return got;
  }
  token(player,type,amount=1){const p=this.s.players[player];const old=p.tokens[type];p.tokens[type]={expires:this.s.turn+1,amount:type==="charge"&&old?.expires===this.s.turn+1?old.amount+amount:amount};}
  addAttack(player){const p=this.s.players[player];p.tokens.attack={amount:(p.tokens.attack?.amount||0)+1};}
  hasToken(player,type){return this.s.players[player].tokens[type]?.expires===this.s.turn;}
  // 重甲持有者打出的牌视为无技能。
  ability(player,card){return plated(this.s.players[player])?"none":card.ability;}
  veilSource(player){
    const s=this.s,p=s.players[player];
    if(has(p,"GEAR_VEIL")&&(p.uses.veil||0)<2)return "veil";
    if(has(p,"GEAR_CLOAK")&&(p.uses.cloak||0)<2)return "cloak";
    // 斗篷持有者本回合已暗置时，可带一名同伴一起暗置。
    if(s.cloakPair&&s.cloakPair[0]!==player&&s.cloakPair[1]===null)return "partner";
    return null;
  }
  modified(player,card,options={}){
    const p=this.s.players[player],prep=this.s.prep[player]||{};let rank=card.rank,suit=card.suit;
    const ab=this.ability(player,card);
    if(options.mirror){check(ab==="mirror_self",t("engine.modified.err1"));rank=C.mirror_total-rank;}
    if(options.low!==undefined){check(ab==="low_self"&&Number.isInteger(options.low)&&options.low>=1&&options.low<=6,t("engine.modified.err2"));rank=options.low;}
    if(options.dice!==undefined){check(has(p,"GEAR_DICE")&&(p.uses.dice||0)<2,t("engine.modified.err3"));check(Number.isInteger(options.dice)&&options.dice>=C.small_min&&options.dice<=C.large_max,t("engine.modified.err4"));rank=options.dice;}
    if(prep.rank!==undefined)rank=prep.rank;

      const d=Number(options[key]||0);check(Number.isInteger(d)&&Math.abs(d)<=limit&&(!d||allowed),t("engine.modified.err5"));rank+=d;
    }
    if(options.suit){check(options.suit!=="black"&&card.suit!=="black"&&Object.hasOwn(suits,options.suit),t("common.bad_suit"));check(ab==="change_self"||this.hasToken(player,"suit")||prep.dye,t("engine.modified.err7"));suit=options.suit;}

    if(options.standard!==undefined){check(has(p,"GEAR_STANDARD")&&!p.uses.standard,t("engine.modified.err9"));check(!this.s.played.length,t("engine.modified.err10"));check(options.standard!=="black"&&Object.hasOwn(suits,options.standard),t("common.bad_suit"));}

  canPlay(player,card,options={}){

      if(options.rope!==undefined||s.noFollow.includes(player))return true;
      return c.suit==="black"||lead==="black"||(!s.played.length&&s.declaredLead===null)||c.suit===(s.played.length?lead:s.declaredLead)||!s.players[player].hand.some(h=>h.uid!==card.uid&&h.suit===(s.played.length?lead:s.declaredLead));

  }
  play(uid,options={}){
    const s=this.s;check(s.phase==="combat",t("engine.play.err1"));const p=s.players[s.current],i=p.hand.findIndex(c=>c.uid===uid);check(i>=0,t("common.pick_own_card"));

      else if(src==="cloak"){p.uses.cloak=(p.uses.cloak||0)+1;s.cloakPair=[s.current,null];}

    if(options.standard!==undefined){p.uses.standard=1;s.declaredLead=options.standard;s.excluded.push(out.uid);this.log(t("engine.play.log2",{p1:s.current+1,p2:suits[options.standard]}));}

  // 鼓槌：轮到自己时可以延后，等其他人出完再出。
  delayPlay(){
    const s=this.s,p=s.players[s.current];check(s.phase==="combat",t("engine.delayPlay.err1"));
    check(has(p,"GEAR_MALLET")&&(p.uses.mallet||0)<2,t("engine.delayPlay.err2"));

  advancePlay(){
    const s=this.s;s.phase="combat";s.afterJobs=null;

      if(s.played.length===3&&s.delayed!==null)s.current=s.delayed;
      else{let n=(s.current+1)%4;if(n===s.delayed)n=(n+1)%4;s.current=n;}
      if(!s.players[s.current].hand.length)this.fail(t("engine.fail.reason_now"));

    s.jobs=s.played.filter(c=>c.hidden&&abilityById[this.ability(c.player,c)]?.timing==="打出时").map(c=>({player:c.player,id:this.ability(c.player,c),cardId:c.uid}));

  finishTrick(){
    const s=this.s,suppressed=s.players.map((q,i)=>plated(q)?i:-1).filter(i=>i>=0);
    const r=evaluateTrick(s.monster,s.played,s.memory,s.leadSuit,s.excluded,suppressed),p=s.players[r.winner];
    r.components=[t("engine.component.hit",{p1:r.hit?C.hit_damage:0}),t("engine.component.extra",{p1:r.extra})];

      for(let i=0;i<4;i++){const q=s.players[i];
        if(has(q,"GEAR_TUNEFORK")&&tuned)boost+=2;
        if(has(q,"GEAR_DRUM")&&i!==r.winner&&s.played.some(c=>c.player===i&&c.suit===r.card.suit))boost++;
        if(has(q,"GEAR_BATON")&&(s.lastTransfers[i]||[]).includes(r.winner))boost+=2;
        if(i!==r.winner&&has(q,"GEAR_BANNER")&&s.memory.last!==null&&s.memory.last!==r.winner)boost++;
      }
      // 猎人笔记：先按已翻面状态加伤，再记录本次花色。
      if(has(p,"GEAR_NOTES")){
        if(p.notes.length>=3)boost++;
        if(r.card.suit!=="black"&&!p.notes.includes(r.card.suit))p.notes.push(r.card.suit);
      }
      if(s.sign===r.winner&&!s.signUsed){boost+=2;s.signUsed=true;}
      if(s.pledge&&s.pledge.player===r.winner&&s.pledge.turn===s.turn){boost+=2;s.gold+=2;this.log(t("engine.finishTrick.log1",{p1:r.winner+1,p2:s.turn}));s.pledge=null;}
      if(has(p,"GEAR_WATCH")&&!p.watch){p.watch=true;this.log(t("engine.finishTrick.log2",{p1:r.winner+1}));}

    }

    r.damage+=boost;r.components.push(t("engine.component.boost",{p1:boost}));
    if(s.wardrum){r.damage*=2;s.wardrum=false;r.components.push(t("engine.component.wardrum"));this.log(t("engine.finishTrick.log_wardrum"));}

    s.trickHistory.push({level:s.level,turn:s.turn,monster:s.monster.name,cards:s.lastPlayed.map(c=>({...c})),winner:r.winner,hit:r.hit,damage:r.damage,components:[...r.components]});

    if(r.hit){
      if(has(p,"GEAR_AXE")&&!p.uses.axe)s.jobs.push({player:r.winner,id:"axe_offer"});

      if(has(q,"GEAR_SHELL")&&!q.uses.shell)s.jobs.push({player:i,id:"shell_offer"});

    const needsTarget=["pass_high","draw_pass","pass_charge","draft_two","pouch","distribute_three","relay_self","yield_relay","gift_draw","recover_one","recover_spent","recover_low","prepare_rank","prepare_suit","charge_offer","whistle_offer","tube_offer","sign_offer","seat_offer","pledge_offer","item_yield","item_bell"].includes(q.id)&&q.step!=="receive";
    if(needsTarget)controls+=playerSelect(q.player,["recover_one","recover_spent","recover_low","prepare_rank","prepare_suit","charge_offer","sign_offer","pledge_offer"].includes(q.id),"target",q.targets);
    if(q.drawn?.length===3)controls+=playerSelect(q.player,false,"target2");
    if(q.drawn?.length===1)controls+=`<label><input id="give" type="checkbox">${t("ui.choice.give")}</label>`;
    controls+=btn(t("ui.choice.confirm"),"resolve","",true);
  }
  return `<div class="controls"><h3>${t("ui.choice.header",{p1:q.player+1,p2:title})}</h3><p>${description}</p>${def?.note?`<p class="choice-note">${def.note}</p>`:""}<div class="choices">${controls}</div></div>`;
}
function directPickers(){
  targetField="target";
  // Keep one value per control; choices themselves are real keyboard-accessible buttons.
  app.querySelectorAll('select:not(#mode)').forEach(select=>{
    const id=select.id,group=document.createElement('div');group.className='pick-group';group.dataset.field=id;
    const input=document.createElement('input');input.type='hidden';input.id=id;input.value=select.value;group.append(input);
    const isCard=['choice-card','delete-card'].includes(id);
    const source=game.s.pending?choiceCards(game.s):game.s.players[actor()]?.hand||[];
    const pool=id==='delete-card'?game.s.deck:source;
    for(const option of select.options){
      const button=document.createElement('button');button.type='button';button.dataset.pick=id;button.dataset.value=option.value;
      button.setAttribute('aria-pressed',String(option.selected));button.className=option.selected?'picked':'';
      const card=isCard&&pool.find(c=>c.uid===option.value);
      if(card){button.classList.add('card',card.suit);button.innerHTML=cardFace(card);if(id==='choice-card')button.dataset.dragChoice=card.uid;}
      else{button.textContent=option.textContent;if(Object.hasOwn(suits,option.value))button.classList.add(option.value,'suit-pick');}
      group.append(button);
    }
    select.replaceWith(group);group.closest('label')?.classList.add('pick-label');
  });
  syncPicks();
}
let targetField='target';
function setPick(field,value){
  const input=document.getElementById(field);if(!input)return;
  input.value=value;
  if(field==='target'||field==='target2')targetField=field;
  syncPicks();updateHint();
}
function syncPicks(){
  app.querySelectorAll('[data-pick]').forEach(b=>{
    const picked=document.getElementById(b.dataset.pick)?.value===b.dataset.value;
    b.classList.toggle('picked',picked);b.setAttribute('aria-pressed',String(picked));
  });
  if(!document.getElementById(targetField))targetField='target';
  const choices=[...app.querySelectorAll(`[data-pick="${targetField}"]`)];
  app.querySelectorAll('[data-seat]').forEach(b=>{
    const allowed=choices.some(c=>c.dataset.value===b.dataset.seat);
    b.disabled=!allowed;b.classList.toggle('targetable',allowed);
    b.classList.toggle('picked',allowed&&document.getElementById(targetField)?.value===b.dataset.seat);
    b.setAttribute('aria-pressed',String(allowed&&document.getElementById(targetField)?.value===b.dataset.seat));
  });
  const resolve=app.querySelector('[data-action="resolve"]');
  if(resolve){const val=id=>document.getElementById(id)?.value;
    resolve.disabled=!!((val('target2')!==undefined&&val('target2')===val('target'))||(val('choice-card2')&&val('choice-card2')===val('choice-card')));
  }
}
// 回合已结算但回合结束效果还没走完时，桌面照样标出赢家和命中结果。
function settledTrick(){const s=game.s,last=s.trickHistory.at(-1);return s.lastResult&&s.played.length&&last&&last.turn===s.turn&&last.level===s.level?last:null;}
function tableView(record=null){
  const s=game.s,done=record||settledTrick(),cards=record?record.cards:s.played,leader=record?record.cards[0].player:s.leader,winner=done?done.winner:null;
  const center=record?`<b>${t("ui.table.trick_done",{p1:record.turn})}</b><small>${t("ui.table.winner",{p1:record.winner+1})}</small><small class="${record.hit?'hit':'miss'}">${resultText(record)}</small>`
    :`<b>${t("ui.table.trick_no",{p1:s.turn})}</b><small>${done?t("ui.table.winner_result",{p1:done.winner+1,p2:done.hit?t("ui.table.hit"):t("ui.table.miss")}):s.phase==='choice'?t("ui.table.resolving",{p1:actor()+1}):isBot()?t("ui.table.thinking",{p1:s.current+1}):t("ui.table.turn_of",{p1:s.current+1})}</small><small>${s.leadSuit?t("ui.table.lead_suit",{p1:suits[s.leadSuit]}):t("ui.table.waiting_lead")}</small><span class="drop-caption">${s.phase==='combat'&&!isBot()?t("ui.table.drop_hint"):s.phase==='choice'?t("ui.table.resolving_hint"):t("ui.table.clockwise")}</span>`;
  return `<div class="current-trick table-wrap"><div class="table-top"><div class="table-center" data-drop-play><span class="table-mark" aria-hidden="true">✦</span>${center}</div>${s.players.map((p,i)=>{
    const order=(i-leader+4)%4,c=cards.find(c=>c.player===i),hidden=c?.hidden&&cards.length<4;
    const original=c&&!hidden?s.deck.find(x=>x.uid===c.uid):null,changed=original&&(original.suit!==c.suit||original.rank!==c.rank);
    return `<div class="table-seat seat-${i} ${!record&&i===actor()?'acting':''} ${i===winner?'winner':''}"><button class="seat-name" data-seat="${i}" disabled><span class="avatar" aria-hidden="true">${i+1}</span><b>${p.name}</b><small>${i===leader?t("ui.table.hand_count_lead",{p1:p.hand.length}):t("ui.table.hand_count",{p1:p.hand.length})}</small></button><article class="played ${c&&!hidden?c.suit:''} ${c&&i===winner?'winner':''}" data-order="${order}"><small>${t("ui.table.seat_order",{p1:order+1})}</small>${!c?`<span class="waiting">${t("ui.table.waiting")}</span>`:hidden?`<div class="card-back"><strong>${t("common.hidden")}</strong></div>`:`<strong class="number">${suits[c.suit]} ${c.rank}</strong>${changed?`<small>${t("common.original_card",{p1:suits[original.suit],p2:original.rank})}</small>`:''}${c.ability==='none'?'':`<p class="desc">${esc(effectText(c))}</p>`}${i===winner?`<span class="winner-label">${t("common.won_round")}</span>`:''}`}</article><div class="seat-gear">${[...p.gear.map(id=>gearById[id]),...p.items].map(x=>`<details><summary>${esc(x.name)}</summary><p>${esc(x.text)}</p></details>`).join('')}${Object.entries(p.tokens).map(([k,v])=>`<small>${tokenText(k,v)}</small>`).join('')}</div></div>`;
  }).join('')}</div></div>`;
}

function combat(record=null){const s=game.s,n=s.monster,viewer=actor(),p=s.players[viewer];
  const phase=n.gate.phases?.[s.memory.step%n.gate.phases.length]||n.gate,wanted=n.gate.cycle?.[s.memory.step%n.gate.cycle.length]||phase?.suit||n.gate.suit;
  const shared=`<section class="battlefield"><aside class="panel monster-panel"><p class="eyebrow">${t("ui.combat.eyebrow",{p1:n.type||t("ui.combat.monster_fallback"),p2:s.level})}</p><div class="row spread"><h2>${n.name}</h2><span>${t("ui.combat.turn_hp",{p1:s.turn,p2:s.hp,p3:n.hp})}</span></div><div class="health"><i style="width:${s.hp/n.hp*100}%"></i></div><p>${t("ui.combat.hit",{p1:n.breach?phase.hit:n.hit})}</p>${n.breach?"":`<p>${t("ui.combat.extra",{p1:n.extra,p2:n.bonus})}</p>`}${n.breach?`<p>${s.memory.step%2!==0?t("ui.combat.breach_on",{p1:n.extra}):n.gate.phases[1].echo?t("ui.combat.breach_off_echo",{p1:n.extra}):t("ui.combat.breach_off",{p1:n.gate.phases[1].hit.replace(/[。；]+$/,""),p2:n.extra})}</p>`:""}${!n.breach&&(n.gate.cycle||n.gate.phases)?`<p>${phase?.size?(phase.size==="small"?t("ui.combat.req_small",{p1:suits[wanted],p2:C.small_max}):t("ui.combat.req_large",{p1:suits[wanted],p2:C.large_min})):t("ui.combat.req_plain",{p1:suits[wanted]})}</p>`:""}${phase.echo?`<p>${t("ui.combat.echo",{p1:s.memory.echoRank})}</p>`:""}${phase.lowest?`<p>${t("ui.combat.lowest")}</p>`:""}${n.collectColors?`<p>${t("ui.combat.collect",{p1:(s.memory.colors||[]).map(c=>suits[c]).join("、")||t("ui.combat.none"),p2:n.collectColors})}</p>`:""}${phase.rotate||n.gate.rotate||n.extraRule==="new_attacker"||s.players.some(p=>p.gear.includes("GEAR_BANNER"))?`<p>${t("ui.combat.last_hit",{p1:s.memory.last===null?t("ui.combat.none"):t("common.player",{p1:s.memory.last+1})})}</p>`:""}${n.gate.unique?`<p>${t("ui.combat.marks",{p1:s.memory.marks.map(i=>t("common.player",{p1:i+1})).join("、")||t("ui.combat.none")})}</p>`:""}${s.flask?`<p>${t("ui.combat.flask",{p1:cardLabel(s.flask)})}</p>`:""}${s.sign!==null&&s.sign!==undefined?`<p>${t("ui.combat.sign",{p1:s.sign+1,p2:s.signUsed?t("ui.combat.sign_used"):""})}</p>`:""}${s.pledge?`<p>${t("ui.combat.pledge",{p1:s.pledge.player+1,p2:s.pledge.turn})}</p>`:""}${s.delayed!==null&&s.delayed!==undefined?`<p>${t("ui.combat.mallet",{p1:s.delayed+1})}</p>`:""}<p>${t("ui.combat.progress",{p1:s.hp>0?t("ui.combat.progress_remain",{p1:s.hp,p2:Math.min(...s.players.map((q,i)=>q.hand.length+(s.played.some(c=>c.player===i)?1:0)))}):t("ui.combat.progress_done")})}</p><div class="deck-count"><span>${t("ui.combat.draw_count",{p1:`<b>${s.draw.length}</b>`})}</span><span>${t("ui.combat.discard_count",{p1:`<b>${s.discard.length}</b>`})}</span></div></aside>${tableView(record)}</section>`;
  if(record){
    const next={shop:[t("ui.combat.next_shop"),t("ui.combat.next_shop_btn")],victory:[t("ui.combat.next_victory"),t("ui.combat.next_result_btn")],retry:[t("ui.combat.next_retry"),t("ui.combat.next_result_btn")],defeat:[t("ui.combat.next_defeat"),t("ui.combat.next_result_btn")]}[s.phase]||[t("ui.combat.next_trick",{p1:s.leader+1}),t("ui.combat.next_trick_btn")];
    return shared+`<section class="panel review-panel"><div class="row spread"><div><h3>${t("ui.combat.review_title",{p1:record.turn,p2:record.winner+1})}</h3><p>${t("ui.combat.review_line",{p1:resultText(record),p2:next[0]})}</p></div>${btn(next[1],"continue","",true)}</div></section>${historyView()}`;
  }
  if(isBot())return shared+`<div class="panel secret">${t("ui.combat.bot_thinking",{p1:viewer+1})}</div>${historyView()}`;
  if(s.mode==="hotseat"&&revealed!==viewer)return shared+`<div class="panel secret"><h3>${t("ui.combat.pass_screen",{p1:viewer+1})}</h3>${btn(t("ui.combat.reveal"),"reveal","",true)}</div>${historyView()}`;
  return shared+`<section class="panel hand-panel"><div class="row spread"><h2>${t("ui.hand.title",{p1:viewer+1,p2:p.hand.length})}</h2><div class="row"><button data-hand-scroll="-1" aria-label="${t("ui.hand.scroll_left")}">‹</button><button data-hand-scroll="1" aria-label="${t("ui.hand.scroll_right")}">›</button>${s.mode==="hotseat"?btn(t("ui.hand.hide"),"hide"):""}</div></div>${s.phase==="choice"&&s.pending.step!=="offer"?"":`<div class="hand">${sortHand(p.hand).map(c=>cardView(c,s.phase==="combat")).join("")}</div>`}${s.phase==="choice"?choiceView():playControls()}${s.phase==="combat"?`<div class="item-actions">${p.items.filter(x=>x.id!=="ITEM_CHARGE").map(x=>btn(t("ui.hand.use_item",{p1:x.name}),"item",`data-uid="${x.uid}" ${p.itemTurn===s.turn?"disabled":""}`)).join("")}</div>`:""}${p.intel.length?`<details><summary>${t("ui.hand.intel")}</summary>${p.intel.map(line=>`<p>${esc(line)}</p>`).join("")}</details>`:""}${s.discard.length?`<details><summary>${t("ui.hand.discard")}</summary>${s.discard.map(c=>`<p>${cardLabel(c)}</p>`).join("")}</details>`:""}</section>${historyView()}`;
}
function ending(){const s=game.s;return `<div class="panel screen-end"><h2>${{retry:t("ui.ending.retry"),defeat:t("ui.ending.defeat"),victory:t("ui.ending.victory")}[s.phase]}</h2><p>${s.phase==="retry"?t("ui.ending.retry_note"):s.phase==="victory"?"":""}</p>${s.phase==="retry"?btn(t("ui.ending.retry_btn"),"retry","",true):btn(t("ui.ending.reset_btn"),"reset","",true)}</div>${historyView()}`;}
function render(){
  cancelDrag();
  clearTimeout(autoTimer);const s=game.s;
  if(review&&s.phase==="setup")review=null;
  app.innerHTML=s.phase==="setup"?setup():`${stats()}${s.phase==="shop"&&!review?nodeView():`<details class="future-nodes"><summary>${t("ui.render.future_nodes")}</summary>${nodeView()}</details>`}${review?combat(review):s.phase==="shop"?shop():["combat","choice"].includes(s.phase)?combat():ending()}`;
  directPickers();updateHint();updateHandScroll();if(!review&&["combat","choice"].includes(s.phase)&&isBot())autoTimer=setTimeout(()=>run(()=>s.phase==="combat"?game.botPlay():game.botResolve()),550);
}
// 手牌放得下就不显示左右箭头。
function updateHandScroll(){const hand=app.querySelector(".hand"),over=!!hand&&hand.scrollWidth>hand.clientWidth+4;app.querySelectorAll("[data-hand-scroll]").forEach(b=>{b.hidden=!over;});}
window.addEventListener("resize",updateHandScroll);
function readOptions(){const val=id=>document.getElementById(id)?.value;return {low:val("low")?Number(val("low")):undefined,adjust:Number(val("adjust")||0),adjust2:Number(val("adjust2")||0),prepared:Number(val("prepared")||0),suit:val("suit")||undefined,mirror:val("mirror")==="1",veil:!!document.getElementById("veil")?.checked,rope:document.getElementById("rope")?.checked?true:undefined,standard:val("standard")||undefined,dice:val("dice")?Number(val("dice")):undefined};}
function updateHint(){const hint=document.querySelector("#playHint");if(!hint)return;const s=game.s,c=s.players[s.current].hand.find(c=>c.uid===selected);if(!c)return;try{const mod=game.modified(s.current,c,readOptions()),legal=game.canPlay(s.current,c,readOptions());hint.textContent=t("ui.updateHint.text",{p1:suits[mod.suit],p2:mod.rank,p3:legal?t("ui.updateHint.legal"):t("ui.updateHint.illegal")});document.querySelector('[data-action="play"]').disabled=!legal;}catch(e){hint.textContent=e.message;}}
function run(fn){const before=actor(),tricks=(game.s.trickHistory||[]).length;try{error.hidden=true;fn();const s=game.s;if(actor()!==before||!["combat","choice"].includes(s.phase)){revealed=null;selected=null;}
    // 一个回合在这次操作里结算完，就停在桌面上；回合结束效果还在走的话等它们结束再停。
    const count=(s.trickHistory||[]).length;if(count>tricks)pendingReview=true;else if(count<tricks)pendingReview=false;
    if(pendingReview&&s.phase!=="choice"){review=s.trickHistory.at(-1);pendingReview=false;}
    if(s.phase!=="shop")game.assertZones();}catch(e){error.textContent=e.message;error.hidden=false;console.error(e);}render();}
function reset(){clearTimeout(autoTimer);game=new Game();window.game=game;revealed=null;selected=null;review=null;pendingReview=false;render();}
document.querySelector("#reset").onclick=()=>{if(game.s.phase!=="setup"&&!confirm(t("ui.reset.confirm")))return;reset();};
app.addEventListener("change",updateHint);
app.addEventListener("click",e=>{const scroll=e.target.closest('[data-hand-scroll]');if(scroll){app.querySelector('.hand')?.scrollBy({left:Number(scroll.dataset.handScroll)*250,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});return;}const pick=e.target.closest("[data-pick]");if(pick){setPick(pick.dataset.pick,pick.dataset.value);return;}const seat=e.target.closest("[data-seat]");if(seat&&!seat.disabled){setPick(targetField,seat.dataset.seat);return;}const b=e.target.closest("[data-action]");if(!b)return;const a=b.dataset.action,val=id=>document.getElementById(id)?.value;
  run(()=>{switch(a){
    case "start":{const mode=val("mode");game=new Game();window.game=game;game.start(mode);break;}
    case "reset":reset();break;
    case "continue":review=null;break;
    case "buy":game.buy(Number(b.dataset.index),Number(val(`owner-${b.dataset.index}`)||0),val(`replace-${b.dataset.index}`));break;
    case "refresh":game.refresh();break;
    case "delete":game.deleteCard(val("delete-card"));break;
    case "leave":game.leaveShop();break;
    case "retry":game.retry();break;
    case "select":selected=b.dataset.card;break;
    case "reveal":revealed=actor();break;
    case "hide":revealed=null;break;
    case "play":game.play(selected,readOptions());selected=null;break;
    case "delay":game.delayPlay();selected=null;break;
    case "item":game.useItem(b.dataset.uid);break;
    case "activate":game.resolve({activate:true});break;
    case "skip":game.resolve({skip:true});break;
    case "resolve":game.resolve({card:val("choice-card"),target:Number(val("target")),target2:Number(val("target2")),rank:Number(val("choice-rank")),suit:val("blank-suit"),turn:Number(val("pledge-turn")),give:!!document.querySelector("#give")?.checked});break;
  }});
});

let drag=null,suppressClickUntil=0,statusTimer=null,dragFrame=null;
function cancelDrag(){if(!drag)return;if(drag.ghost)suppressClickUntil=performance.now()+350;cancelAnimationFrame(dragFrame);drag.ghost?.remove();drag.source?.classList.remove('dragging');document.querySelectorAll('.drop-ready,.drop-over').forEach(x=>x.classList.remove('drop-ready','drop-over'));drag=null;}
function announce(text){const status=document.getElementById('interaction-status');status.textContent=text;clearTimeout(statusTimer);statusTimer=setTimeout(()=>{status.textContent='';},4500);}
function scrollDrag(){if(!drag?.ghost)return;const y=drag.pointerY;const speed=y<70?-16:y>innerHeight-70?16:0;if(speed)window.scrollBy(0,speed);dragFrame=requestAnimationFrame(scrollDrag);}
function dropTarget(x,y){const el=document.elementFromPoint(x,y);return el?.closest(drag?.kind==='choice'?'[data-seat]':'[data-drop-play]');}
function dropCard(uid,options){
 if(game.s.phase!=='combat'||isBot()||(game.s.mode==='hotseat'&&revealed!==actor()))return;
 if(!game.canPlay(game.s.current,game.s.players[actor()].hand.find(c=>c.uid===uid),options)){
   selected=uid;render();announce(t("ui.dropCard.illegal"));return;
 }
 run(()=>{game.play(uid,options);selected=null;});announce(t("ui.dropCard.played"));
}
app.addEventListener('pointerdown',e=>{
 const source=e.target.closest('[data-drag-card],[data-drag-choice]');
 if(!source||source.disabled||e.button!==0||isBot())return;
 drag={source,id:e.pointerId,kind:source.dataset.dragChoice?'choice':'play',uid:source.dataset.dragChoice||source.dataset.dragCard,x:e.clientX,y:e.clientY,who:actor(),phase:game.s.phase,options:selected===source.dataset.dragCard?readOptions():{},wasSelected:selected===source.dataset.dragCard};
});
window.addEventListener('pointermove',e=>{
 if(!drag||drag.id!==e.pointerId)return;
 drag.pointerY=e.clientY;
 if(!drag.ghost&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<9)return;
 if(!drag.ghost){
  drag.ghost=drag.source.cloneNode(true);drag.ghost.classList.add('drag-ghost');drag.ghost.removeAttribute('id');drag.ghost.setAttribute('aria-hidden','true');document.body.append(drag.ghost);drag.source.classList.add('dragging');
  drag.source.setPointerCapture?.(e.pointerId);dragFrame=requestAnimationFrame(scrollDrag);
  document.querySelectorAll(drag.kind==='choice'?'[data-seat]:not(:disabled)':'[data-drop-play]').forEach(x=>x.classList.add('drop-ready'));
 }
 e.preventDefault();drag.ghost.style.left=`${e.clientX-70}px`;drag.ghost.style.top=`${e.clientY-45}px`;
 document.querySelectorAll('.drop-over').forEach(x=>x.classList.remove('drop-over'));const target=dropTarget(e.clientX,e.clientY);if(target&&!target.disabled)target.classList.add('drop-over');
},{passive:false});
window.addEventListener('pointerup',e=>{
 if(!drag||drag.id!==e.pointerId)return;
 const d=drag,target=dropTarget(e.clientX,e.clientY),moved=!!d.ghost;
 cancelDrag();if(!moved)return;suppressClickUntil=performance.now()+350;
 if(d.who!==actor()||d.phase!==game.s.phase||!target||target.disabled){announce(t("ui.drag.cancel"));return;}
 if(d.kind==='choice'){setPick('choice-card',d.uid);setPick(targetField,target.dataset.seat);announce(t("ui.drag.picked",{p1:Number(target.dataset.seat)+1}));return;}
 const c=game.s.players[actor()].hand.find(c=>c.uid===d.uid);if(!c)return;
 if(!d.wasSelected&&( ['low_self','adjust_self','adjust_two','mirror_self','change_self'].includes(c.ability)||game.hasToken(actor(),'rank')||game.hasToken(actor(),'suit')||game.s.prep[actor()]?.dye)){
  selected=d.uid;render();announce(t("ui.drag.need_options"));document.querySelector('[data-action="play"]')?.focus();return;
 }
 dropCard(d.uid,d.options);
});
window.addEventListener('pointercancel',cancelDrag);window.addEventListener('blur',cancelDrag);
window.addEventListener('keydown',e=>{if(e.key==='Escape'){cancelDrag();announce(t("ui.drag.cancel"));}});
app.addEventListener('click',e=>{if(performance.now()<suppressClickUntil){e.preventDefault();e.stopImmediatePropagation();}},true);

render();
// 浏览器测试需要在直接驱动引擎后重绘；外部改过状态就不再停在旧的一个回合上。
function renderDemo(){review=null;pendingReview=false;render();}
window.renderDemo=renderDemo;

return {renderDemo:renderDemo};
})();
})();</script></body></html>
